<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            background: #050505; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Courier New', monospace;
        }

        .container {
            font-weight: bold;
            font-size: 1.5rem;
            white-space: nowrap;
        }

        /* The neon glowing text effect */
        .neon-text {
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite, glow 1.5s ease-in-out infinite alternate;
        }

        /* This resets the style for emojis */
        .no-anim {
            -webkit-text-fill-color: initial;
            background: none;
            animation: none;
            filter: none;
            display: inline-block;
        }

        @keyframes shine { to { background-position: 200% center; } }
        @keyframes glow { from { filter: drop-shadow(0 0 5px #ff00ff); } to { filter: drop-shadow(0 0 20px #00ffff); } }
    </style>
</head>
<body>
    <div class="container neon-text">
        <span class="no-anim">📍</span> Bhadohi, UP, India | 
        <span class="no-anim">🎓</span> AIML @ OIST | 
        <span class="no-anim">📧</span> vishwakarmajatin084@gmail.com
    </div>
</body>
</html>
