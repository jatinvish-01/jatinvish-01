<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
  .text { 
    font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px;
    background: linear-gradient(90deg, #00d2ff, #9d4edd, #00d2ff);
    background-size: 200% auto;
    color: transparent; -webkit-background-clip: text;
    animation: shine 3s linear infinite;
  }
  .emoji { color: white; display: inline-block; }
  @keyframes shine { to { background-position: 200% center; } }
</style>
</head>
<body>
  <div class="text"><span class="emoji">⚡</span> Building Intelligent AI Systems Today — For a Smarter Tomorrow <span class="emoji">⚡</span></div>
</body>
</html>
